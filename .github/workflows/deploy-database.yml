name: Deploy Database Schema

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  migrate:
    name: Apply Liquibase changelog to Aurora DSQL
    runs-on: ubuntu-latest

    env:
      # DSQL exposes a plain Postgres endpoint on 5432 and requires TLS. Its certificate
      # chains to Amazon Root CA 1, which is already in the runner's trust store.
      #
      # sslrootcert is not optional here. AWS documents PGSSLROOTCERT=system, but that is
      # libpq syntax; the JDBC driver does not understand "system" and falls back to
      # ~/.postgresql/root.crt, which does not exist on a runner. Pointing it at the OS
      # bundle is the JDBC equivalent. If a future runner image drops the Amazon root,
      # download https://www.amazontrust.com/repository/AmazonRootCA1.pem in a step and
      # point sslrootcert at that instead.
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${{ vars.DSQL_ENDPOINT }}:5432/postgres?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt
      LIQUIBASE_COMMAND_USERNAME: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # DSQL has no password. The "password" is a short-lived IAM-signed token, so it is
      # generated immediately before use rather than stored as a secret. Masking it is not
      # optional: until it expires it is a working admin credential for the cluster, and
      # anything that dumps the environment would otherwise put it in the run log.
      - name: Generate DSQL auth token
        run: |
          token=$(aws dsql generate-db-connect-admin-auth-token \
            --hostname "${{ vars.DSQL_ENDPOINT }}" \
            --region "${{ env.AWS_REGION }}" \
            --expires-in 3600)
          echo "::add-mask::$token"
          echo "LIQUIBASE_COMMAND_PASSWORD=$token" >> "$GITHUB_ENV"

      # The AWS IAM GRANT changesets need the ARNs of the roles that connect as giftexchange_user.
      # Building them from the caller's account id keeps the changelog account-agnostic.
      - name: Resolve database role ARNs
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "APP_ROLE_ARN=arn:aws:iam::${account_id}:role/giftexchange-app-exec-role" >> "$GITHUB_ENV"
          echo "SCHEDULER_ROLE_ARN=arn:aws:iam::${account_id}:role/giftexchange-cooled-off-scheduler-handler-lambda-role" >> "$GITHUB_ENV"
          # The inbound mail role no longer exists, but --0008 granted to it and --0014 revokes it,
          # and both still need the ARN substituted.
          echo "INBOUND_MAIL_ROLE_ARN=arn:aws:iam::${account_id}:role/giftexchange-inbound-gift-ideas-handler-lambda-role" >> "$GITHUB_ENV"
          echo "DELIVERY_EVENTS_ROLE_ARN=arn:aws:iam::${account_id}:role/giftexchange-delivery-events-handler-lambda-role" >> "$GITHUB_ENV"
          echo "DATA_DELETION_ROLE_ARN=arn:aws:iam::${account_id}:role/giftexchange-data-deletion-handler-lambda-role" >> "$GITHUB_ENV"
          echo "EXCHANGE_DATE_SWEEP_ROLE_ARN=arn:aws:iam::${account_id}:role/giftexchange-exchange-date-sweep-handler-lambda-role" >> "$GITHUB_ENV"
          echo "UNDELIVERABLE_INVITATIONS_ROLE_ARN=arn:aws:iam::${account_id}:role/giftexchange-undeliverable-invitations-handler-lambda-role" >> "$GITHUB_ENV"

      # Liquibase is a Java application. GitHub-hosted runners already have a JRE; a
      # self-hosted runner would need actions/setup-java before this step.
      - name: Setup Liquibase
        uses: liquibase/setup-liquibase@v3
        with:
          version: '4.32.0'
          edition: 'oss'

      - name: Validate changelog
        run: liquibase validate --changelog-file=db/changelog.yaml -Dapp_role_arn="$APP_ROLE_ARN" -Dscheduler_role_arn="$SCHEDULER_ROLE_ARN" -Dinbound_mail_role_arn="$INBOUND_MAIL_ROLE_ARN" -Ddelivery_events_role_arn="$DELIVERY_EVENTS_ROLE_ARN" -Ddata_deletion_role_arn="$DATA_DELETION_ROLE_ARN" -Dexchange_date_sweep_role_arn="$EXCHANGE_DATE_SWEEP_ROLE_ARN" -Dundeliverable_invitations_role_arn="$UNDELIVERABLE_INVITATIONS_ROLE_ARN"

      - name: Apply changelog
        run: liquibase update --changelog-file=db/changelog.yaml -Dapp_role_arn="$APP_ROLE_ARN" -Dscheduler_role_arn="$SCHEDULER_ROLE_ARN" -Dinbound_mail_role_arn="$INBOUND_MAIL_ROLE_ARN" -Ddelivery_events_role_arn="$DELIVERY_EVENTS_ROLE_ARN" -Ddata_deletion_role_arn="$DATA_DELETION_ROLE_ARN" -Dexchange_date_sweep_role_arn="$EXCHANGE_DATE_SWEEP_ROLE_ARN" -Dundeliverable_invitations_role_arn="$UNDELIVERABLE_INVITATIONS_ROLE_ARN"
