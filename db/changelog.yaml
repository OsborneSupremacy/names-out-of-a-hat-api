  - changeSet:
      id: participant_eligible_recipients--0001
      author: ben
      changes:
        - sqlFile:
            path: tables/participant_eligible_recipients--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE participant_eligible_recipients

  - changeSet:
      id: idx_hats_organizer_email--0001
      author: ben
      comment: Backs "list my gift exchanges", the only unqualified read in the application.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_hats_organizer_email ON hats (organizer_email)
      rollback:
        - sql:
            sql: DROP INDEX idx_hats_organizer_email

  - changeSet:
      id: uq_hats_organizer_name--0001
      author: ben
      comment: One gift exchange name per organizer, compared case-insensitively.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_hats_organizer_name ON hats (organizer_email, name_normalized)
      rollback:
        - sql:
            sql: DROP INDEX uq_hats_organizer_name

  - changeSet:
      id: uq_participants_hat_email--0001
      author: ben
      comment: >
        One row per email per hat. Deliberately no equivalent on name, so two participants
        may share a display name.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_participants_hat_email ON participants (hat_id, email)
      rollback:
        - sql:
            sql: DROP INDEX uq_participants_hat_email

  - changeSet:
      id: uq_eligible_recipients_participant_eligible--0001
      author: ben
      comment: >
        Replaces the guarantee the old composite primary key gave: a participant cannot be
        made eligible for the same recipient twice. Duplicate rows would inflate the
        eligibility counts EligibilityValidationService relies on. The leading column also
        covers lookups by participant_id.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_eligible_recipients_participant_eligible ON participant_eligible_recipients (participant_id, eligible_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX uq_eligible_recipients_participant_eligible

  - changeSet:
      id: idx_eligible_recipients_eligible_participant--0001
      author: ben
      comment: >
        Covers the reverse direction, which is what removing a participant needs. Lookups by
        participant_id are served by uq_eligible_recipients_participant_eligible above.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_eligible_recipients_eligible_participant ON participant_eligible_recipients (eligible_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_eligible_recipients_eligible_participant

  - changeSet:
      id: giftexchange_user--0001
      author: ben
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP ROLE giftexchange_user

  - changeSet:
      id: giftexchange_user--0002
      author: ben
      comment: CRUD on every table. Add a new changeset here whenever a table is added.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, UPDATE, DELETE ON hats, participants, participant_eligible_recipients FROM giftexchange_user

  - changeSet:
      id: giftexchange_user--0003
      author: ben
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0003.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT ON hat_status FROM giftexchange_user

  - changeSet:
      id: giftexchange_user--0004
      author: ben
      comment: >
        Maps the application's IAM role onto this database role. The checksum covers the
        substituted ARN, so moving accounts means a new changeset rather than an edit.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0004.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: AWS IAM REVOKE giftexchange_user FROM '${app_role_arn}'

  - changeSet:
      id: giftexchange_user--0005
      author: ben
      comment: The cooled-off scheduler connects as this role too.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0005.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: AWS IAM REVOKE giftexchange_user FROM '${scheduler_role_arn}'

  - changeSet:
      id: hats--0002
      author: ben
      comment: Origin of the send, for abuse investigation.
      changes:
        - sqlFile:
            path: tables/hats--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: ALTER TABLE hats DROP COLUMN invitations_sent_from_ip

  # ---------------------------------------------------------------------------------------------
  # Rebuild. Person became a first class table, which every other table now points at, and the
  # nullable columns and defaults went away with the old shape. The changesets below drop the
  # original tables outright: there was no data worth migrating, and a rewrite is easier to read
  # afterwards than a column-by-column reshaping would have been.
  #
  # The drops come first so that a database already carrying the old tables is left with only the
  # new ones. An environment created from scratch runs them against tables the earlier changesets
  # in this file have just created, so they succeed there too.
  # ---------------------------------------------------------------------------------------------

  - changeSet:
      id: participant_eligible_recipients--0002
      author: ben
      comment: Dropped first, since it is what the other two tables were joined through.
      changes:
        - sqlFile:
            path: tables/participant_eligible_recipients--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: CREATE TABLE participant_eligible_recipients (participant_eligible_recipients_id UUID PRIMARY KEY, participant_id UUID NOT NULL, eligible_participant_id UUID NOT NULL)

  - changeSet:
      id: participants--0002
      author: ben
      changes:
        - sqlFile:
            path: tables/participants--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: CREATE TABLE participants (id UUID PRIMARY KEY, hat_id UUID NOT NULL, name VARCHAR(100) NOT NULL, email VARCHAR(254) NOT NULL, picked_recipient_id UUID)

  - changeSet:
      id: hats--0003
      author: ben
      changes:
        - sqlFile:
            path: tables/hats--0003.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: CREATE TABLE hats (id UUID PRIMARY KEY, organizer_email VARCHAR(254) NOT NULL, organizer_name VARCHAR(100) NOT NULL, name VARCHAR(50) NOT NULL, name_normalized VARCHAR(50) NOT NULL, status VARCHAR(30) NOT NULL, additional_information VARCHAR(2000) NOT NULL DEFAULT '', price_range VARCHAR(50) NOT NULL DEFAULT '', invitations_queued_at TIMESTAMPTZ, created_at TIMESTAMPTZ NOT NULL, invitations_sent_from_ip VARCHAR(45))

  - changeSet:
      id: hat_status--0003
      author: ben
      comment: >
        The reference table goes too. It never constrained anything -- DSQL has no foreign keys --
        and HatStatuses in the library is the list the application actually checks against.
      changes:
        - sqlFile:
            path: tables/hat_status--0003.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: CREATE TABLE hat_status (status VARCHAR(30) PRIMARY KEY)

  - changeSet:
      id: person--0001
      author: ben
      comment: One row per email address, for organizers and participants alike.
      changes:
        - sqlFile:
            path: tables/person--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE person

  - changeSet:
      id: hat--0001
      author: ben
      changes:
        - sqlFile:
            path: tables/hat--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE hat

  - changeSet:
      id: participant--0001
      author: ben
      changes:
        - sqlFile:
            path: tables/participant--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE participant

  - changeSet:
      id: participant_eligible_recipient--0001
      author: ben
      changes:
        - sqlFile:
            path: tables/participant_eligible_recipient--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE participant_eligible_recipient

  - changeSet:
      id: uq_person_email--0001
      author: ben
      comment: >
        Email is the identity of a person, so this is the index that makes the table a directory
        rather than a list. Every lookup starts here: the session carries an email address, not an
        id.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_person_email ON person (email)
      rollback:
        - sql:
            sql: DROP INDEX uq_person_email

  - changeSet:
      id: idx_hat_organizer_person--0001
      author: ben
      comment: Backs "list my gift exchanges", the only unqualified read in the application.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_hat_organizer_person ON hat (organizer_person_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_hat_organizer_person

  - changeSet:
      id: uq_hat_organizer_name--0001
      author: ben
      comment: One gift exchange name per organizer, compared case-insensitively.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_hat_organizer_name ON hat (organizer_person_id, name_normalized)
      rollback:
        - sql:
            sql: DROP INDEX uq_hat_organizer_name

  - changeSet:
      id: uq_participant_hat_person--0001
      author: ben
      comment: >
        One row per person per hat. This replaces the old index on (hat_id, email): the address is
        no longer stored here, and a person id says the same thing more directly. Deliberately no
        equivalent on name, which is not stored here either -- two participants may still share a
        display name, and the application is what refuses to let that happen.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_participant_hat_person ON participant (hat_id, person_id)
      rollback:
        - sql:
            sql: DROP INDEX uq_participant_hat_person

  - changeSet:
      id: uq_participant_eligible_recipient--0001
      author: ben
      comment: >
        A participant cannot be made eligible for the same recipient twice. Duplicate rows would
        inflate the eligibility counts EligibilityValidationService relies on. The leading column
        also covers lookups by participant_id.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_participant_eligible_recipient ON participant_eligible_recipient (participant_id, eligible_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX uq_participant_eligible_recipient

  - changeSet:
      id: idx_participant_eligible_recipient_eligible--0001
      author: ben
      comment: >
        Covers the reverse direction, which is what removing a participant needs. Lookups by
        participant_id are served by uq_participant_eligible_recipient above.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_participant_eligible_recipient_eligible ON participant_eligible_recipient (eligible_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_participant_eligible_recipient_eligible

  - changeSet:
      id: giftexchange_user--0006
      author: ben
      comment: >
        CRUD on the rebuilt tables. The grants in --0002 and --0003 disappeared along with the
        tables they named, so this replaces both rather than adding to them.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0006.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, UPDATE, DELETE ON person, hat, participant, participant_eligible_recipient FROM giftexchange_user

  - changeSet:
      id: person--0002
      author: ben
      comment: >
        The row meaning "nobody", so that an unset person id points at something real. Applied
        before hat--0002, which references it.
      changes:
        - sqlFile:
            path: tables/person--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DELETE FROM person WHERE person_id = '00000000-0000-0000-0000-000000000000'

  - changeSet:
      id: hat--0002
      author: ben
      comment: The row meaning "no gift exchange". Its organizer is the sentinel person.
      changes:
        - sqlFile:
            path: tables/hat--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DELETE FROM hat WHERE hat_id = '00000000-0000-0000-0000-000000000000'

  - changeSet:
      id: participant--0002
      author: ben
      comment: >
        The row meaning "not taking part", so that a pick can be followed with an inner join. It
        belongs to the two sentinels above and draws itself.
      changes:
        - sqlFile:
            path: tables/participant--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DELETE FROM participant WHERE participant_id = '00000000-0000-0000-0000-000000000000'

  # Two changesets for one column: add it, then fill in the rows that already exist. There is no
  # third making it NOT NULL -- see the note on hat--0003.
  - changeSet:
      id: hat--0003
      author: ben
      comment: >
        Which exchange a copy came from, or the all-zero id if it was not copied. That id is the
        sentinel hat, so "not a copy" still names a row and a query following this column can inner
        join rather than outer.

        Stays nullable, which the rest of the schema is not. DSQL rejects ALTER COLUMN ... SET NOT
        NULL, and a column cannot be added as NOT NULL to a table that already holds rows without a
        default to fill them -- and this schema has none. hat--0004 fills in the rows that existed;
        the application supplies a value for every row written after that. Nothing here can enforce
        it, exactly as nothing here can enforce a foreign key.

        Groundwork for eligibility that spans years; nothing reads it yet.
      changes:
        - sql:
            sql: ALTER TABLE hat ADD COLUMN copied_from_hat_id UUID
      rollback:
        - sql:
            sql: ALTER TABLE hat DROP COLUMN copied_from_hat_id

  - changeSet:
      id: hat--0004
      author: ben
      comment: >
        Nothing that already exists was recorded as a copy, the sentinel included, so every row
        starts out pointing at "no gift exchange". Unconditional on purpose: the column was only
        just added, so no row has it set.
      changes:
        - sql:
            sql: UPDATE hat SET copied_from_hat_id = '00000000-0000-0000-0000-000000000000'
      rollback:
        - sql:
            sql: UPDATE hat SET copied_from_hat_id = NULL

  - changeSet:
      id: gift_idea--0001
      author: ben
      comment: >
        Gift ideas a participant shares with whoever drew them. Append-only, newest row wins.
      changes:
        - sqlFile:
            path: tables/gift_idea--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE gift_idea

  - changeSet:
      id: idx_gift_idea_participant--0001
      author: ben
      comment: >
        Both questions this table is asked start from a participant: what is their newest
        submission, and have they made one at all. Ordered by created_at within the participant so
        the first is an index scan rather than a sort over everything they have ever sent.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_gift_idea_participant ON gift_idea (participant_id, created_at)
      rollback:
        - sql:
            sql: DROP INDEX idx_gift_idea_participant

  - changeSet:
      id: gift_idea_token--0001
      author: ben
      comment: >
        The routing token issued to a participant when invitations go out, stored as a hash.
      changes:
        - sqlFile:
            path: tables/gift_idea_token--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE gift_idea_token

  - changeSet:
      id: uq_gift_idea_token_hash--0001
      author: ben
      comment: >
        Inbound mail knows the token and nothing else, so this is the one path that reaches a
        participant without a hat id.

        Genuinely unique, which the equivalent column on participant could not have been: this table
        starts empty, so there is no crowd of backfilled rows sharing an empty string for a unique
        index to reject.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_gift_idea_token_hash ON gift_idea_token (token_hash)
      rollback:
        - sql:
            sql: DROP INDEX uq_gift_idea_token_hash

  - changeSet:
      id: uq_gift_idea_token_participant--0001
      author: ben
      comment: >
        One live token per participant. Reissuing replaces the row rather than adding a second
        address that still writes to the same participant.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_gift_idea_token_participant ON gift_idea_token (participant_id)
      rollback:
        - sql:
            sql: DROP INDEX uq_gift_idea_token_participant

  - changeSet:
      id: giftexchange_user--0007
      author: ben
      comment: >
        CRUD on the gift ideas tables. A separate changeset rather than an addition to --0006,
        whose checksum covers the tables it named when it ran.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0007.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, UPDATE, DELETE ON gift_idea, gift_idea_token FROM giftexchange_user

  - changeSet:
      id: giftexchange_user--0008
      author: ben
      comment: >
        The inbound mail Lambda connects as this role too. Its IAM role has dsql:DbConnect, which
        only permits opening a connection; this decides which database role it opens one as.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0008.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: AWS IAM REVOKE giftexchange_user FROM '${inbound_mail_role_arn}'

  - changeSet:
      id: uq_gift_idea_token_participant--0002
      author: ben
      comment: >
        Drops the one-token-per-participant rule. The Ask feature has to send somebody a working
        SHARE GIFT IDEAS address in an email they did not originally receive, and only the hash of
        their existing token is stored, so it cannot be reconstructed. Issuing an additional token
        is the way to do that; replacing theirs in place would silently kill the address sitting in
        their invitation.

        Several live tokens per participant is therefore the intended state. Every one of them
        routes to the same row, because the lookup is by token hash and never by participant.
      changes:
        - sql:
            sql: DROP INDEX uq_gift_idea_token_participant
      rollback:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_gift_idea_token_participant ON gift_idea_token (participant_id)

  - changeSet:
      id: idx_gift_idea_token_participant--0001
      author: ben
      comment: >
        What the dropped unique index was also doing incidentally: making the cleanup in
        DeleteParticipantAsync and DeleteHatAsync, which filter on participant_id, an index lookup
        rather than a scan. Not unique, for the reason above.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_gift_idea_token_participant ON gift_idea_token (participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_gift_idea_token_participant

  - changeSet:
      id: gift_idea_ask--0001
      author: ben
      comment: >
        One participant asking another for ideas about a third. The original Ask needed no table
        because gift_idea_token already said everything it meant; asking somebody other than your
        own pick involves three participants, and a row naming one cannot say which.
      changes:
        - sqlFile:
            path: tables/gift_idea_ask--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE gift_idea_ask

  - changeSet:
      id: contributed_gift_idea--0001
      author: ben
      comment: >
        Suggestions somebody made about another participant. Kept apart from gift_idea so that a
        third party's guess can never be forwarded as though the subject had written it themselves.
      changes:
        - sqlFile:
            path: tables/contributed_gift_idea--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE contributed_gift_idea

  - changeSet:
      id: uq_gift_idea_ask_hash--0001
      author: ben
      comment: >
        The lookup inbound mail makes. It knows the token and nothing else, so this index is the
        whole route from an address to an ask.

        Unique, like uq_gift_idea_token_hash: the table starts empty, so there is no crowd of
        backfilled rows for a unique index to reject.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_gift_idea_ask_hash ON gift_idea_ask (token_hash)
      rollback:
        - sql:
            sql: DROP INDEX uq_gift_idea_ask_hash

  - changeSet:
      id: idx_gift_idea_ask_asker--0001
      author: ben
      comment: >
        Cleanup, and the only one of the three columns DeleteHatAsync needs: every ask in a hat was
        made by a participant of that hat, so filtering on the asker reaches all of them.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_gift_idea_ask_asker ON gift_idea_ask (asker_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_gift_idea_ask_asker

  - changeSet:
      id: idx_gift_idea_ask_helper--0001
      author: ben
      comment: >
        Removing one participant has to reach asks in all three roles, not just the asker's. An ask
        whose helper has left the exchange would otherwise keep a live address pointed at somebody
        who is no longer in it.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_gift_idea_ask_helper ON gift_idea_ask (helper_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_gift_idea_ask_helper

  - changeSet:
      id: idx_gift_idea_ask_subject--0001
      author: ben
      comment: >
        The third role, for the same cleanup. Ideas about somebody who has left the exchange have
        nobody to be about.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_gift_idea_ask_subject ON gift_idea_ask (subject_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_gift_idea_ask_subject

  - changeSet:
      id: idx_contributed_gift_idea_ask--0001
      author: ben
      comment: >
        Both questions this table is asked start from an ask: the newest suggestion sent in reply to
        one, and the sweep that removes them when the ask goes. Not unique -- accumulating rows is
        the point, as it is in gift_idea.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_contributed_gift_idea_ask ON contributed_gift_idea (gift_idea_ask_id, created_at)
      rollback:
        - sql:
            sql: DROP INDEX idx_contributed_gift_idea_ask

  - changeSet:
      id: giftexchange_user--0009
      author: ben
      comment: >
        CRUD on the tables behind asking somebody other than your own pick. Both the application
        function and the inbound mail function connect as this role, so one grant covers writing an
        ask when somebody asks and appending a suggestion when one arrives.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0009.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, UPDATE, DELETE ON gift_idea_ask, contributed_gift_idea FROM giftexchange_user

  - changeSet:
      id: participant_email_delivery--0001
      author: ben
      comment: >
        What SES said happened to each participant email. Nothing recorded any of this before: a
        send that was accepted and then bounced looked exactly like one that arrived, so an address
        with a typo in it silently left somebody out of the exchange.

        Keyed on the SES message id rather than the participant, because that is the identifier the
        send and the events share, and because the invitation and the completion email are two
        different messages to the same person.
      changes:
        - sqlFile:
            path: tables/participant_email_delivery--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE participant_email_delivery

  - changeSet:
      id: uq_participant_email_delivery_message--0001
      author: ben
      comment: >
        The lookup every event makes, and the key both writers upsert on. An event knows the message
        id and the tags that were on the send, and nothing else.

        Unique, like uq_gift_idea_token_hash: the table starts empty, so there is no crowd of
        backfilled rows for a unique index to reject.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_participant_email_delivery_message ON participant_email_delivery (ses_message_id)
      rollback:
        - sql:
            sql: DROP INDEX uq_participant_email_delivery_message

  - changeSet:
      id: idx_participant_email_delivery_participant--0001
      author: ben
      comment: >
        Both of the other questions this table is asked: the newest row for each participant, which
        is what the organizer's view shows, and the sweep that removes them in DeleteParticipantAsync
        and DeleteHatAsync. Ordered by occurred_at because "newest" is decided by what SES said, not
        by the id.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_participant_email_delivery_participant ON participant_email_delivery (participant_id, occurred_at)
      rollback:
        - sql:
            sql: DROP INDEX idx_participant_email_delivery_participant

  - changeSet:
      id: giftexchange_user--0010
      author: ben
      comment: >
        CRUD on participant_email_delivery. The delivery event function writes it and the API
        function reads it, and both connect as this role, so one grant covers both.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0010.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, UPDATE, DELETE ON participant_email_delivery FROM giftexchange_user

  - changeSet:
      id: giftexchange_user--0011
      author: ben
      comment: >
        Lets the delivery event function connect as giftexchange_user. The counterpart of --0008,
        for the second function that reaches DSQL without going through the API.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0011.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: AWS IAM REVOKE giftexchange_user FROM '${delivery_events_role_arn}'

  - changeSet:
      id: do_not_add_to_exchange--0001
      author: ben
      comment: >
        The first of the three do-not-add lists: addresses that must never be added to one
        particular exchange again. Written when somebody leaves from the link in their invitation.

        Kept as three tables rather than one with a scope column, because the three answer
        genuinely different questions and a single table would need two nullable columns to say
        which question a row was answering. DSQL cannot ALTER COLUMN, so a column that starts
        nullable stays nullable, and a nullable scope is how the wrong row eventually gets matched.
      changes:
        - sqlFile:
            path: tables/do_not_add_to_exchange--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE do_not_add_to_exchange

  - changeSet:
      id: uq_do_not_add_to_exchange--0001
      author: ben
      comment: >
        The only question this table is asked, and the constraint that makes recording a refusal
        idempotent: leaving twice, or an organizer removing and the participant leaving, writes one
        row rather than failing.

        email_normalized leads, as it does on all three lists, so every check is the same predicate
        shape against the same leading column. The address is what the caller always has; the hat is
        the narrowing.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_do_not_add_to_exchange ON do_not_add_to_exchange (email_normalized, hat_id)
      rollback:
        - sql:
            sql: DROP INDEX uq_do_not_add_to_exchange

  - changeSet:
      id: do_not_add_by_organizer--0001
      author: ben
      comment: >
        The second list: addresses that must never be added to any exchange run by one organizer.
        Offered on the leave page and recorded only if it is asked for.
      changes:
        - sqlFile:
            path: tables/do_not_add_by_organizer--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE do_not_add_by_organizer

  - changeSet:
      id: uq_do_not_add_by_organizer--0001
      author: ben
      comment: >
        As uq_do_not_add_to_exchange, with the organizer's address as the narrowing rather than a
        hat. Unique for the same reason: a second refusal of the same organizer is the same
        refusal.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_do_not_add_by_organizer ON do_not_add_by_organizer (email_normalized, organizer_email_normalized)
      rollback:
        - sql:
            sql: DROP INDEX uq_do_not_add_by_organizer

  - changeSet:
      id: do_not_add_anywhere--0001
      author: ben
      comment: >
        The third list: addresses that must never be added to any exchange by anybody. The closest
        thing here to an unsubscribe, and the reason the other two exist as separate tables -- this
        one has no scope at all, and a shared table would have carried an empty column for it.
      changes:
        - sqlFile:
            path: tables/do_not_add_anywhere--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE do_not_add_anywhere

  - changeSet:
      id: uq_do_not_add_anywhere--0001
      author: ben
      comment: >
        One row per address, and the index that both enforces it and answers the check. The whole
        table is this index.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_do_not_add_anywhere ON do_not_add_anywhere (email_normalized)
      rollback:
        - sql:
            sql: DROP INDEX uq_do_not_add_anywhere

  - changeSet:
      id: participant_leave_token--0001
      author: ben
      comment: >
        The token behind the leave link in an invitation. Issued with the gift ideas tokens when
        invitations go out, and never for the organizer.
      changes:
        - sqlFile:
            path: tables/participant_leave_token--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE participant_leave_token

  - changeSet:
      id: uq_participant_leave_token_hash--0001
      author: ben
      comment: >
        The lookup the leave pages make. A link knows the token and nothing else, so this is the
        one path that reaches a participant without a hat id -- the same shape as
        uq_gift_idea_token_hash, and unique for the same reason.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_participant_leave_token_hash ON participant_leave_token (token_hash)
      rollback:
        - sql:
            sql: DROP INDEX uq_participant_leave_token_hash

  - changeSet:
      id: idx_participant_leave_token_participant--0001
      author: ben
      comment: >
        So that reissuing, and the cleanup in DeleteParticipantAsync and DeleteHatAsync, can find a
        participant's token without a scan. Not unique: reissuing deletes and rewrites rather than
        relying on a constraint, and the window in between is inside a transaction either way.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_participant_leave_token_participant ON participant_leave_token (participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_participant_leave_token_participant

  - changeSet:
      id: giftexchange_user--0012
      author: ben
      comment: >
        CRUD on the three do-not-add lists and on participant_leave_token. All four are reached by
        the API function, which connects as this role.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0012.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, UPDATE, DELETE ON do_not_add_to_exchange, do_not_add_by_organizer, do_not_add_anywhere, participant_leave_token FROM giftexchange_user

  # Two changesets for one column again: add it, then fill in the rows that already exist. As with
  # hat--0003, there is no third making it NOT NULL.
  - changeSet:
      id: hat--0005
      author: ben
      comment: >
        When the hat last changed status. Every write that moves status now writes this alongside
        it, so "how long has this sat where it is" is a column rather than something inferred from
        invitations_queued_at and created_at.

        Stays nullable, for the reasons hat--0003 gives: DSQL rejects ALTER COLUMN ... SET NOT
        NULL, and a column cannot be added as NOT NULL to a table that already holds rows without a
        default to fill them -- and this schema has none. hat--0006 fills in the rows that existed;
        HatEntity.StatusUpdatedAt being non-nullable is what keeps every row written after that
        filled.
      changes:
        - sql:
            sql: ALTER TABLE hat ADD COLUMN status_updated_at TIMESTAMPTZ
      rollback:
        - sql:
            sql: ALTER TABLE hat DROP COLUMN status_updated_at

  - changeSet:
      id: hat--0006
      author: ben
      comment: >
        The best available guess at when each existing row last moved: invitations_queued_at if it
        is set, since queuing invitations is a status change, and created_at otherwise -- which is
        when a hat took the status it was created with.

        The two NULLIFs drop the infinite timestamps. Npgsql writes DateTimeOffset.MinValue as
        -infinity and DateTimeOffset.MaxValue as infinity, so a hat whose invitations were never
        queued carries -infinity rather than 0001-01-01, and GREATEST ignores the NULL they become.
        Dropping -infinity changes nothing on its own -- created_at already beats it -- but
        infinity would otherwise win over every real date, and neither belongs in an answer to
        "when".

        Unconditional on purpose: the column was only just added, so no row has it set.
      changes:
        - sql:
            sql: UPDATE hat SET status_updated_at = GREATEST(created_at, NULLIF(NULLIF(invitations_queued_at, 'infinity'::TIMESTAMPTZ), '-infinity'::TIMESTAMPTZ))
      rollback:
        - sql:
            sql: UPDATE hat SET status_updated_at = NULL

  # Two changesets for one column, exactly as with hat--0005 and hat--0006: add it, then fill in
  # the rows that already exist. It was written to arrive NOT NULL DEFAULT '' instead, on the
  # reading that the header only ruled out tightening a column after the fact -- DSQL rejected both
  # the constraint and the default, so this is one more column the application owns.
  - changeSet:
      id: participant--0003
      author: ben
      comment: >
        The face a participant is marked with wherever they are named — in the participant list, in
        the invitation that tells somebody whose name they drew, and in the announcement listing the
        whole draw.

        It used to be derived from the name every time one was needed, which agreed with itself
        across emails without storing anything and left the organizer no way to change it. A column
        is what an edit needs.

        Stays nullable, for the reasons hat--0005 gives: DSQL rejects ALTER COLUMN ... SET NOT
        NULL, and will not take a NOT NULL or a DEFAULT on an ADD COLUMN either, so nothing fills
        the rows this table already holds except a statement of its own. participant--0004 is that
        statement; ParticipantEntity.Emoji being non-nullable is what keeps every row written after
        it filled.
      changes:
        - sqlFile:
            path: tables/participant--0003.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: ALTER TABLE participant DROP COLUMN emoji

  - changeSet:
      id: participant--0004
      author: ben
      comment: >
        A face for every row that predates the column, spread across the list by a byte of the
        participant id's digest, and the empty string for the sentinel participant.

        Unconditional on purpose: the column was only just added, so every row is holding the NULL
        it arrived as.
      changes:
        - sqlFile:
            path: tables/participant--0004.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: UPDATE participant SET emoji = NULL

  # Two changesets for one column again, for the reason hat--0005/0006 and participant--0003/0004
  # give: DSQL will not take a NOT NULL or a DEFAULT on an ADD COLUMN, so the rows already in the
  # table are filled by a statement of their own.
  - changeSet:
      id: person--0003
      author: ben
      comment: >
        Who introduced this person to the application, which is what decides whose name it is to
        change.

        A name lives on the person and nowhere else, so editing one is felt in every exchange they
        appear in. Two people may make that edit: the person themselves, and whoever first typed
        their name into an exchange. Telling the second of those from a stranger is the whole
        reason for the column — without it, any organizer sharing a participant with another can
        rename them out from under both.
      changes:
        - sqlFile:
            path: tables/person--0003.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: ALTER TABLE person DROP COLUMN added_by_person_id

  - changeSet:
      id: person--0004
      author: ben
      comment: >
        An introducer for every row that predates the column, reconstructed from the exchanges each
        person takes part in: the organizer of the earliest one is who added them, because
        AddParticipantService is the only path in and the organizer is always its caller.

        Anybody that finds nothing for arrived under their own steam and gets their own id, the
        sentinel included.

        Unconditional on purpose: the column was only just added, so every row is holding the NULL
        it arrived as.
      changes:
        - sqlFile:
            path: tables/person--0004.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: UPDATE person SET added_by_person_id = NULL

  - changeSet:
      id: giftexchange_user--0013
      author: ben
      comment: >
        Lets the data deletion function connect as giftexchange_user. The counterpart of --0011, for
        the function that carries out a queued request to delete somebody's data.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0013.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: AWS IAM REVOKE giftexchange_user FROM '${data_deletion_role_arn}'

  - changeSet:
      id: giftexchange_user--0014
      author: ben
      comment: >
        Withdraws --0008. The inbound mail Lambda is gone, and a role recreated later under the same
        name would otherwise inherit its grant.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0014.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: AWS IAM GRANT giftexchange_user TO '${inbound_mail_role_arn}'

  - changeSet:
      id: gift_idea--0002
      author: ben
      comment: >
        Whether a submission is held back until the person who drew the writer asks for it. A
        participant who would rather not push ideas at somebody who never wanted them had no way to
        write anything down at all before this.

        Stays nullable, for the reasons hat--0005 and person--0003 give: DSQL rejects ALTER COLUMN
        ... SET NOT NULL, and takes neither a NOT NULL nor a DEFAULT on an ADD COLUMN, so the rows
        already in the table can only be filled by a statement of their own. gift_idea--0003 is that
        statement; GiftIdeaEntity.HoldUntilAsked being non-nullable is what keeps every row written
        after it filled.
      changes:
        - sqlFile:
            path: tables/gift_idea--0002.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: ALTER TABLE gift_idea DROP COLUMN hold_until_asked

  - changeSet:
      id: gift_idea--0003
      author: ben
      comment: >
        Every submission that predates the column was shared outright, because there was no way to
        hold one back. FALSE is what happened to these rows rather than a guess at what their writers
        would have chosen.

        Unconditional on purpose: the column was only just added, so every row is holding the NULL it
        arrived as.
      changes:
        - sqlFile:
            path: tables/gift_idea--0003.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: UPDATE gift_idea SET hold_until_asked = NULL

  - changeSet:
      id: gift_idea_enquiry--0001
      author: ben
      comment: >
        One participant having asked for gift ideas about their own pick, which is what releases a
        held submission to them. Nothing recorded this durably: asking the pick themselves wrote no
        row at all, only a token, an email and a throttle entry that expires after a week -- and a
        participant may write held ideas long after somebody asked, so the fact has to outlive the
        asking.
      changes:
        - sqlFile:
            path: tables/gift_idea_enquiry--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE gift_idea_enquiry

  - changeSet:
      id: uq_gift_idea_enquiry_asker_subject--0001
      author: ben
      comment: >
        The lookup both the Ask and the share page make: has this giver asked about this participant.
        One row per pair -- asking again changes nothing about what is owed to them.

        Unique, for the reason uq_gift_idea_ask_hash--0001 gives: the table starts empty, so there is
        no crowd of backfilled rows sharing a value for a unique index to reject.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ASYNC uq_gift_idea_enquiry_asker_subject ON gift_idea_enquiry (asker_participant_id, subject_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX uq_gift_idea_enquiry_asker_subject

  - changeSet:
      id: idx_gift_idea_enquiry_subject--0001
      author: ben
      comment: >
        Removing a participant has to reach the rows naming them as a subject as well as the ones
        naming them as an asker. No third index: the asker side is the leading column of
        uq_gift_idea_enquiry_asker_subject, and deleting a hat filters on the asker alone, since both
        participants an enquiry names belong to the same exchange.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_gift_idea_enquiry_subject ON gift_idea_enquiry (subject_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_gift_idea_enquiry_subject

  - changeSet:
      id: giftexchange_user--0015
      author: ben
      comment: >
        CRUD on gift_idea_enquiry. A separate changeset rather than an addition to --0009, whose
        checksum covers the tables it named when it ran. UPDATE as well as INSERT, because released_at
        is stamped on a row that already exists.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0015.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, UPDATE, DELETE ON gift_idea_enquiry FROM giftexchange_user

  - changeSet:
      id: offered_gift_idea--0001
      author: ben
      comment: >
        Ideas offered about another participant without being asked. A table of its own rather than
        rows in contributed_gift_idea, because the recipient of a contribution is frozen on its ask
        and the recipient of an offer is resolved when it is sent -- so an offer has nothing to point
        at, and contributed_gift_idea--0001 says in as many words that who a suggestion was sent to
        lives on the ask and is not repeated.
      changes:
        - sqlFile:
            path: tables/offered_gift_idea--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE offered_gift_idea

  - changeSet:
      id: idx_offered_gift_idea_author--0001
      author: ben
      comment: >
        Removing a participant has to reach what they wrote. Deleting a whole hat needs only this
        one, for the reason the asks and enquiries give: both participants an offer names belong to
        the same exchange, so the author side reaches every row of it.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_offered_gift_idea_author ON offered_gift_idea (author_participant_id, created_at)
      rollback:
        - sql:
            sql: DROP INDEX idx_offered_gift_idea_author

  - changeSet:
      id: idx_offered_gift_idea_subject--0001
      author: ben
      comment: >
        The other half of removing one participant: what everybody else wrote about them, which the
        author index does not reach. Unlike the hat sweep, a single participant leaving cannot rely
        on the whole exchange going at once.
      changes:
        - sql:
            sql: CREATE INDEX ASYNC idx_offered_gift_idea_subject ON offered_gift_idea (subject_participant_id)
      rollback:
        - sql:
            sql: DROP INDEX idx_offered_gift_idea_subject

  - changeSet:
      id: giftexchange_user--0016
      author: ben
      comment: >
        SELECT, INSERT and DELETE on offered_gift_idea. No UPDATE: the table is append-only and has
        no counterpart to released_at or to the token hash a revocation overwrites. A separate
        changeset rather than an addition to --0009 or --0015, whose checksums cover the tables they
        named when they ran.
      changes:
        - sqlFile:
            path: roles/giftexchange_user--0016.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT, DELETE ON offered_gift_idea FROM giftexchange_user
