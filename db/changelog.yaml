# Aurora DSQL constraints that shape this changelog:
#
#   * One DDL statement per changeset. Every sqlFile below sets splitStatements: false and
#     holds exactly one statement, so what Liquibase sends is what the file contains.
#   * Secondary indexes require CREATE INDEX ASYNC. They are one-liners, so they sit inline
#     here rather than in files.
#   * No foreign keys, so referential cleanup on delete lives in the application.
#   * ALTER TABLE ... ALTER COLUMN ... SET NOT NULL is rejected outright, so a column cannot be
#     tightened after the fact: whatever it arrives as, it stays. Nor will a column arrive
#     constrained -- neither NOT NULL nor a DEFAULT to fill the rows the table already holds is
#     accepted on an ADD COLUMN, which participant--0003 was written to do and could not. A column
#     added to a table that already exists is nullable forever, and the application is what keeps
#     it filled: the arrangement hat--0003, hat--0005 and participant--0003 are all stuck with, and
#     the same division of labour as the missing foreign keys.
#
# Files are named <object>--<nnnn>.sql so every change to an object sorts together. When
# this file gets long, move the settled changesets into an archive changelog.

databaseChangeLog:
  - changeSet:
      id: hat_status--0001
      author: ben
      changes:
        - sqlFile:
            path: tables/hat_status--0001.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TABLE hat_status

  - changeSet:
